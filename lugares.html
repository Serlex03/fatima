<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugares y Aventuras</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav-interna">
        <a href="index.html" class="btn-volver">← Volver al Inicio</a>
    </div>

    <section class="seccion">
        <h2>Lugares Visitados y Por Visitar</h2>
        
        <!-- Sistema de Pestañas -->
        <div class="tabs">
            <button id="btn-tab-pendientes" class="tab-btn activo" onclick="cambiarTab('pendientes')">Por Visitar</button>
            <button id="btn-tab-completadas" class="tab-btn" onclick="cambiarTab('completadas')">Ya Visitados</button>
        </div>

        <!-- Input para agregar nuevos lugares -->
        <div class="input-grupo">
            <input type="text" id="input-lugar" placeholder="Añadir un lugar o actividad...">
            <button onclick="agregarItem('lugar')">Agregar</button>
        </div>

        <!-- Lista de Pendientes (Visible por defecto) -->
        <div id="vista-pendientes">
            <ul id="lista-lugares-pendientes"></ul>
        </div>
        
        <!-- Lista de Visitados (Oculta por defecto) -->
        <div id="vista-completadas" style="display: none;">
            <ul id="lista-lugares-completadas" class="lista-completada"></ul>
        </div>
    </section>

    <script type="module" src="script.js"></script>
</body>
</html>
